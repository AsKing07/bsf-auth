spring.application.name=bsf-auth

# Spike : on n'écoute que sur la boucle locale.
server.address=127.0.0.1
server.port=9000

# Le mot de passe de l'utilisateur fictif N'EST PAS dans le dépôt (dépôt public, D-038).
# Il doit être fourni à l'exécution : variable d'environnement BSF_SPIKE_USER_PASSWORD
# ou argument --bsf.spike.user.password=... ; l'application refuse de démarrer sans lui.
# bsf.spike.user.password=  <- volontairement absent

logging.level.org.springframework.security=INFO
